<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Swipe Converter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --card: #1a1a1a;
    --card-border: #2a2a2a;
    --accent: #00aaff;
    --accent-glow: rgba(0, 170, 255, 0.15);
    --text: #e8e8e8;
    --text-dim: #888;
    --text-muted: #555;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #0077cc);
    margin-bottom: 16px;
  }

  .logo svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 15px;
  }

  /* Input section */
  .input-section {
    margin-bottom: 32px;
  }

  .input-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .input-wrapper {
    position: relative;
  }

  .date-input {
    width: 100%;
    padding: 16px 20px;
    font-size: 18px;
    font-family: inherit;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .date-input::placeholder {
    color: var(--text-muted);
  }

  .date-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .format-hints {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .hint-chip {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .hint-chip:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  /* Error */
  .error-msg {
    background: rgba(255, 60, 60, 0.1);
    border: 1px solid rgba(255, 60, 60, 0.25);
    color: #ff6b6b;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    margin-bottom: 24px;
    display: none;
  }

  .error-msg.visible {
    display: block;
  }

  /* MMDDYY breakdown label */
  .breakdown-label {
    text-align: center;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--text-dim);
  }

  .breakdown-label span {
    color: var(--accent);
    font-weight: 600;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    letter-spacing: 1px;
  }

  /* Digit cards */
  .digit-cards {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .digit-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 8px;
    text-align: center;
    transition: border-color 0.2s, transform 0.2s;
    animation: cardIn 0.3s ease both;
  }

  .digit-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .digit-card:nth-child(1) { animation-delay: 0.05s; }
  .digit-card:nth-child(2) { animation-delay: 0.1s; }
  .digit-card:nth-child(3) { animation-delay: 0.15s; }
  .digit-card:nth-child(4) { animation-delay: 0.2s; }
  .digit-card:nth-child(5) { animation-delay: 0.25s; }
  .digit-card:nth-child(6) { animation-delay: 0.3s; }

  .digit-card .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .digit-card .number {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 10px;
  }

  .digit-card .arrows {
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .digit-card .dirs {
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.3;
  }

  /* Info section */
  .info-section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .info-row {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    gap: 10px;
    border-bottom: 1px solid var(--card-border);
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-row.today-row {
    background: rgba(0, 170, 255, 0.04);
  }

  .info-col {
    flex: 1;
    min-width: 0;
  }

  .info-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .info-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-value.today-val {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .info-value .days-num {
    color: var(--accent);
    font-size: 20px;
  }

  /* Small copy button */
  .copy-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-dim);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .copy-sm:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .copy-sm.copied {
    background: rgba(34, 204, 136, 0.12);
    border-color: #22cc88;
    color: #22cc88;
  }

  .copy-sm svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  /* Full sequence */
  .sequence-section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    margin-bottom: 12px;
  }

  .seq-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .sequence-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .sequence-text {
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.6;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    text-align: center;
  }

  /* Copy All button */
  .copy-all-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    margin-bottom: 32px;
  }

  .copy-all-btn:hover {
    background: var(--accent);
    color: #000;
  }

  .copy-all-btn:active {
    transform: scale(0.98);
  }

  .copy-all-btn.copied {
    background: #22cc88;
    border-color: #22cc88;
    color: #000;
  }

  .copy-all-btn svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  /* Results wrapper — hidden initially */
  .results {
    display: none;
  }

  .results.visible {
    display: block;
  }

  /* Legend */
  .legend {
    margin-top: 8px;
  }

  .legend-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    transition: border-color 0.15s;
    user-select: none;
  }

  .legend-header:hover {
    border-color: var(--accent);
  }

  .legend-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .legend-chevron {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--text-dim);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s;
  }

  .legend.open .legend-chevron {
    transform: rotate(180deg);
  }

  .legend-body {
    display: none;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
  }

  .legend.open .legend-header {
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .legend.open .legend-body {
    display: block;
  }

  .legend-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .legend-item {
    text-align: center;
    padding: 12px 4px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .legend-item:hover {
    border-color: var(--card-border);
  }

  .legend-item .num {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .legend-item .arr {
    font-size: 18px;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .legend-item .desc {
    font-size: 10px;
    color: var(--text-dim);
  }

  /* Clock visual */
  .clock-visual {
    display: flex;
    justify-content: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }

  .clock-svg {
    width: 200px;
    height: 200px;
  }

  /* Responsive */
  @media (max-width: 520px) {
    .container { padding: 32px 16px 60px; }
    h1 { font-size: 22px; }
    .digit-cards { gap: 8px; }
    .digit-card { padding: 14px 8px; }
    .digit-card .number { font-size: 28px; }
    .digit-card .arrows { font-size: 20px; }
    .digit-card .dirs { font-size: 10px; }
    .sequence-text { font-size: 20px; letter-spacing: 2px; }
    .legend-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .legend-item .num { font-size: 16px; }
    .legend-item .arr { font-size: 14px; }
    .info-value { font-size: 14px; }
    .info-value .days-num { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <h1>Clock Swipe Converter</h1>
    <p class="subtitle">Convert any date into a joystick directional sequence</p>
  </div>

  <!-- Input -->
  <div class="input-section">
    <label class="input-label" for="dateInput">Enter a date</label>
    <div class="input-wrapper">
      <input
        type="text"
        id="dateInput"
        class="date-input"
        placeholder="March 24, 1995"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <div class="format-hints">
      <span class="hint-chip" data-example="March 24, 1995">March 24, 1995</span>
      <span class="hint-chip" data-example="11/05/78">11/05/78</span>
      <span class="hint-chip" data-example="03-24-95">03-24-95</span>
      <span class="hint-chip" data-example="032495">032495</span>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="breakdown-label" id="breakdownLabel"></div>
    <div class="digit-cards" id="digitCards"></div>

    <!-- Info rows -->
    <div class="info-section">
      <!-- Today reference (no copy btn) -->
      <div class="info-row today-row">
        <div class="info-col">
          <div class="info-label">Today (New York)</div>
          <div class="info-value today-val" id="todayValue"></div>
        </div>
      </div>
      <!-- Input date -->
      <div class="info-row">
        <div class="info-col">
          <div class="info-label">Input Date</div>
          <div class="info-value" id="inputDateValue"></div>
        </div>
        <button class="copy-sm" id="copyDateBtn" title="Copy date" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <!-- Days ago -->
      <div class="info-row">
        <div class="info-col">
          <div class="info-label">Days Ago</div>
          <div class="info-value" id="daysAgoValue"></div>
        </div>
        <button class="copy-sm" id="copyDaysBtn" title="Copy days ago" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <!-- Day of week -->
      <div class="info-row">
        <div class="info-col">
          <div class="info-label">Day of Week</div>
          <div class="info-value" id="dowValue"></div>
        </div>
        <button class="copy-sm" id="copyDowBtn" title="Copy day of week" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <!-- Date numbers only -->
      <div class="info-row">
        <div class="info-col">
          <div class="info-label">Date Numbers</div>
          <div class="info-value" id="dateNumsValue"></div>
        </div>
        <button class="copy-sm" id="copyDateNumsBtn" title="Copy date numbers" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
    </div>

    <!-- Sequence -->
    <div class="sequence-section">
      <div class="seq-header">
        <div class="sequence-label">Clock Swipe Sequence</div>
        <button class="copy-sm" id="copySeqBtn" title="Copy sequence" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <div class="sequence-text" id="sequenceText"></div>
    </div>

    <!-- Copy All -->
    <button class="copy-all-btn" id="copyAllBtn" type="button">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="copyAllLabel">Copy All</span>
    </button>
  </div>

  <!-- Legend -->
  <div class="legend" id="legend">
    <div class="legend-header" id="legendToggle">
      <span class="legend-title">Reference — All 10 Digits</span>
      <svg class="legend-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="legend-body">
      <div class="legend-grid" id="legendGrid"></div>
      <div class="clock-visual">
        <svg class="clock-svg" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
          <g id="clockDigits" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central"></g>
          <circle cx="100" cy="100" r="3" fill="#00aaff"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<script>
  // Clock-face digit mapping
  const DIGIT_MAP = {
    0: { dirs: ['up', 'up'],       arrows: '↑↑' },
    1: { dirs: ['up', 'right'],    arrows: '↑→' },
    2: { dirs: ['right', 'up'],    arrows: '→↑' },
    3: { dirs: ['right', 'right'], arrows: '→→' },
    4: { dirs: ['right', 'down'],  arrows: '→↓' },
    5: { dirs: ['down', 'right'],  arrows: '↓→' },
    6: { dirs: ['down', 'down'],   arrows: '↓↓' },
    7: { dirs: ['down', 'left'],   arrows: '↓←' },
    8: { dirs: ['left', 'down'],   arrows: '←↓' },
    9: { dirs: ['left', 'left'],   arrows: '←←' },
  };

  const MONTHS = {
    'january': '01', 'february': '02', 'march': '03', 'april': '04',
    'may': '05', 'june': '06', 'july': '07', 'august': '08',
    'september': '09', 'october': '10', 'november': '11', 'december': '12',
    'jan': '01', 'feb': '02', 'mar': '03', 'apr': '04',
    'jun': '06', 'jul': '07', 'aug': '08', 'sep': '09',
    'sept': '09', 'oct': '10', 'nov': '11', 'dec': '12'
  };

  const MONTH_NAMES = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];

  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  // Labels for 5-digit (single-digit month) and 6-digit (double-digit month)
  const PART_LABELS_5 = ['M', 'D', 'D', 'Y', 'Y'];
  const PART_LABELS_6 = ['M', 'M', 'D', 'D', 'Y', 'Y'];

  // Get today's date in New York timezone
  function getTodayNY() {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      year: 'numeric', month: '2-digit', day: '2-digit'
    });
    const parts = fmt.formatToParts(new Date());
    const get = type => parseInt(parts.find(p => p.type === type).value, 10);
    return new Date(get('year'), get('month') - 1, get('day'));
  }

  // Expand 2-digit year
  function expandYear(yy) {
    const currentYY = new Date().getFullYear() % 100;
    return yy <= currentYY ? 2000 + yy : 1900 + yy;
  }

  function parseDate(input) {
    const s = input.trim();
    if (!s) return null;

    // Pure 6-digit: MMDDYY
    if (/^\d{6}$/.test(s)) {
      const mm = s.slice(0, 2), dd = s.slice(2, 4), yy = s.slice(4, 6);
      if (validMMDD(mm, dd)) return mm + dd + yy;
    }

    // MM/DD/YY or MM-DD-YY or MM.DD.YY
    const sepMatch = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (sepMatch) {
      const mm = sepMatch[1].padStart(2, '0');
      const dd = sepMatch[2].padStart(2, '0');
      let yy = sepMatch[3];
      if (yy.length === 4) yy = yy.slice(2);
      if (validMMDD(mm, dd)) return mm + dd + yy;
    }

    // Spelled-out: "March 24, 1995" or "24 March 1995"
    const spelled = s.toLowerCase().replace(/,/g, '').replace(/\s+/g, ' ').trim();
    const parts = spelled.split(' ');

    if (parts.length >= 2) {
      let monthStr, dayStr, yearStr;
      if (MONTHS[parts[0]]) {
        monthStr = parts[0]; dayStr = parts[1]; yearStr = parts[2] || '00';
      } else if (parts.length >= 2 && MONTHS[parts[1]]) {
        monthStr = parts[1]; dayStr = parts[0]; yearStr = parts[2] || '00';
      }
      if (monthStr && MONTHS[monthStr]) {
        const mm = MONTHS[monthStr];
        const dd = String(parseInt(dayStr, 10)).padStart(2, '0');
        let yy = String(parseInt(yearStr, 10));
        if (yy.length === 4) yy = yy.slice(2);
        yy = yy.padStart(2, '0');
        if (validMMDD(mm, dd)) return mm + dd + yy;
      }
    }

    return null;
  }

  function validMMDD(mm, dd) {
    const m = parseInt(mm, 10), d = parseInt(dd, 10);
    return m >= 1 && m <= 12 && d >= 1 && d <= 31;
  }

  function getDateInfo(mmddyy) {
    const mm = parseInt(mmddyy.slice(0, 2), 10);
    const dd = parseInt(mmddyy.slice(2, 4), 10);
    const yy = parseInt(mmddyy.slice(4, 6), 10);
    const fullYear = expandYear(yy);

    const inputDate = new Date(fullYear, mm - 1, dd);
    const today = getTodayNY();

    const diffMs = today - inputDate;
    const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

    const dow = DAY_NAMES[inputDate.getDay()];
    const formattedInput = `${MONTH_NAMES[mm - 1]} ${dd}, ${fullYear}`;
    const formattedToday = `${MONTH_NAMES[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;

    let daysLabel;
    if (diffDays === 0) daysLabel = 'Today';
    else if (diffDays === 1) daysLabel = '1 day ago';
    else if (diffDays > 1) daysLabel = `${diffDays.toLocaleString()} days ago`;
    else if (diffDays === -1) daysLabel = '1 day from now';
    else daysLabel = `${Math.abs(diffDays).toLocaleString()} days from now`;

    return { formattedInput, formattedToday, daysLabel, diffDays, dow };
  }

  function renderResults(mmddyy) {
    // Strip leading zero from month for single-digit months (Jan–Sep)
    const displayStr = mmddyy[0] === '0' ? mmddyy.slice(1) : mmddyy;
    const digits = displayStr.split('');
    const partLabels = digits.length === 5 ? PART_LABELS_5 : PART_LABELS_6;

    const resultsEl = document.getElementById('results');
    const cardsEl = document.getElementById('digitCards');
    const seqEl = document.getElementById('sequenceText');
    const breakdownEl = document.getElementById('breakdownLabel');
    const errorEl = document.getElementById('errorMsg');

    errorEl.classList.remove('visible');
    resultsEl.classList.add('visible');

    // Breakdown label
    const mm = mmddyy.slice(0, 2), dd = mmddyy.slice(2, 4), yy = mmddyy.slice(4, 6);
    const mmDisplay = mm[0] === '0' ? mm[1] : mm; // strip leading zero for display
    breakdownEl.innerHTML = `MMDDYY &rarr; <span>${mmDisplay}</span> / <span>${dd}</span> / <span>${yy}</span>`;

    // Adjust grid columns dynamically
    cardsEl.style.gridTemplateColumns = `repeat(${digits.length}, 1fr)`;

    // Digit cards
    cardsEl.innerHTML = '';
    const arrowParts = [];

    digits.forEach((d, i) => {
      const info = DIGIT_MAP[parseInt(d, 10)];
      arrowParts.push(info.arrows);
      const card = document.createElement('div');
      card.className = 'digit-card';
      card.style.animationDelay = `${i * 0.05}s`;
      card.innerHTML = `
        <div class="label">${partLabels[i]}</div>
        <div class="number">${d}</div>
        <div class="arrows">${info.arrows}</div>
        <div class="dirs">${info.dirs[0]}, ${info.dirs[1]}</div>
      `;
      cardsEl.appendChild(card);
    });

    // Full sequence — commas between each digit's arrows
    const fullSeq = arrowParts.join(', ');
    seqEl.textContent = fullSeq;

    // Date info
    const info = getDateInfo(mmddyy);
    document.getElementById('todayValue').textContent = info.formattedToday;
    document.getElementById('inputDateValue').textContent = info.formattedInput;
    document.getElementById('dateNumsValue').textContent = displayStr;

    const daysEl = document.getElementById('daysAgoValue');
    if (info.diffDays === 0) {
      daysEl.textContent = 'Today';
    } else {
      const num = Math.abs(info.diffDays).toLocaleString();
      const suffix = info.diffDays > 0 ? 'days ago' : 'days from now';
      daysEl.innerHTML = `<span class="days-num">${num}</span> ${suffix}`;
    }
    document.getElementById('dowValue').textContent = info.dow;

    // Store data for Copy All
    // daysNum = plain integer string, no comma, no label (for individual copy)
    const daysNum = info.diffDays === 0 ? '0' : String(Math.abs(info.diffDays));
    resultsEl.dataset.date = info.formattedInput;
    resultsEl.dataset.dateNums = displayStr;
    resultsEl.dataset.daysNum = daysNum;
    resultsEl.dataset.days = info.daysLabel;
    resultsEl.dataset.dow = info.dow;
    resultsEl.dataset.seq = fullSeq;
  }

  function showError(msg) {
    const errorEl = document.getElementById('errorMsg');
    const resultsEl = document.getElementById('results');
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
    resultsEl.classList.remove('visible');
  }

  // iOS-safe clipboard copy
  function copyToClipboard(text) {
    return new Promise((resolve, reject) => {
      // Try modern API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(resolve).catch(() => {
          legacyCopy(text) ? resolve() : reject();
        });
      } else {
        legacyCopy(text) ? resolve() : reject();
      }
    });
  }

  function legacyCopy(text) {
    try {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;';
      document.body.appendChild(el);
      el.focus();
      el.select();
      el.setSelectionRange(0, el.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(el);
      return ok;
    } catch (e) { return false; }
  }

  // Generic copy helper
  function copyText(text, btn, label) {
    copyToClipboard(text).then(() => {
      btn.classList.add('copied');
      if (label) {
        const prev = label.textContent;
        label.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); label.textContent = prev; }, 1500);
      } else {
        const origHTML = btn.innerHTML;
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>';
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = origHTML; }, 1500);
      }
    });
  }

  // Input handler with debounce
  let debounceTimer;
  document.getElementById('dateInput').addEventListener('input', function () {
    clearTimeout(debounceTimer);
    const val = this.value;
    debounceTimer = setTimeout(() => {
      if (!val.trim()) {
        document.getElementById('errorMsg').classList.remove('visible');
        document.getElementById('results').classList.remove('visible');
        return;
      }
      const parsed = parseDate(val);
      if (parsed) {
        renderResults(parsed);
      } else {
        showError('Could not parse date. Try formats like "March 24, 1995", "03/24/95", "03-24-95", or "032495".');
      }
    }, 300);
  });

  // Hint chips
  document.querySelectorAll('.hint-chip').forEach(chip => {
    chip.addEventListener('click', function () {
      const input = document.getElementById('dateInput');
      input.value = this.dataset.example;
      input.dispatchEvent(new Event('input'));
    });
  });

  // Individual copy buttons
  document.getElementById('copyDateBtn').addEventListener('click', function () {
    copyText(document.getElementById('inputDateValue').textContent, this);
  });
  document.getElementById('copyDaysBtn').addEventListener('click', function () {
    // Copy number only — no comma, no "days ago"
    copyText(document.getElementById('results').dataset.daysNum, this);
  });
  document.getElementById('copyDateNumsBtn').addEventListener('click', function () {
    copyText(document.getElementById('results').dataset.dateNums, this);
  });
  document.getElementById('copyDowBtn').addEventListener('click', function () {
    copyText(document.getElementById('dowValue').textContent, this);
  });
  document.getElementById('copySeqBtn').addEventListener('click', function () {
    copyText(document.getElementById('sequenceText').textContent, this);
  });

  // Copy All — plain values only, one per line (matches individual copy output)
  document.getElementById('copyAllBtn').addEventListener('click', function () {
    const r = document.getElementById('results');
    const lines = [
      r.dataset.date,
      r.dataset.days,
      r.dataset.dow,
      r.dataset.dateNums,
      r.dataset.seq
    ];
    const text = lines.join('\n');
    const label = document.getElementById('copyAllLabel');
    copyText(text, this, label);
  });

  // Legend toggle
  document.getElementById('legendToggle').addEventListener('click', function () {
    document.getElementById('legend').classList.toggle('open');
  });

  // Build legend grid
  (function buildLegend() {
    const grid = document.getElementById('legendGrid');
    for (let i = 0; i <= 9; i++) {
      const info = DIGIT_MAP[i];
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <div class="num">${i}</div>
        <div class="arr">${info.arrows}</div>
        <div class="desc">${info.dirs[0]}, ${info.dirs[1]}</div>
      `;
      grid.appendChild(item);
    }
  })();

  // Build clock SVG
  (function buildClock() {
    const g = document.getElementById('clockDigits');
    const cx = 100, cy = 100, r = 72;
    for (let i = 0; i <= 9; i++) {
      const angle = (i * 36 - 90) * (Math.PI / 180);
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', x);
      text.setAttribute('y', y);
      text.setAttribute('font-size', '16');
      text.setAttribute('fill', '#00aaff');
      text.textContent = i;
      g.appendChild(text);

      const info = DIGIT_MAP[i];
      const arrowText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      arrowText.setAttribute('x', x);
      arrowText.setAttribute('y', y + 14);
      arrowText.setAttribute('font-size', '10');
      arrowText.setAttribute('fill', '#888');
      arrowText.setAttribute('font-weight', '400');
      arrowText.textContent = info.arrows;
      g.appendChild(arrowText);

      const tickR1 = 88, tickR2 = 84;
      const tx1 = cx + tickR1 * Math.cos(angle);
      const ty1 = cy + tickR1 * Math.sin(angle);
      const tx2 = cx + tickR2 * Math.cos(angle);
      const ty2 = cy + tickR2 * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', tx1); line.setAttribute('y1', ty1);
      line.setAttribute('x2', tx2); line.setAttribute('y2', ty2);
      line.setAttribute('stroke', '#444');
      line.setAttribute('stroke-width', '1.5');
      g.appendChild(line);
    }
  })();
</script>
</body>
